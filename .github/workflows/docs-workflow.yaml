name: Docs generation for Github Pages

on:
  push:
    branches:
    - 'main'
    - 'release-*'

env:
  DOXYGEN_VERSION: 1.12.0

jobs:
  docs:
    runs-on: ubuntu-latest
    concurrency:
      group: api-docs-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v4
      with:
        path: edgehog-device-esp32
    - uses: actions/checkout@v4
      with:
        repository: edgehog-device-manager/docs
        ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
        path: docs
    - name: Install doxygen
      working-directory: edgehog-device-esp32
      shell: bash
      run: |
        wget --no-verbose "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
        tar xf doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz
        echo "${PWD}/doxygen-${DOXYGEN_VERSION}/bin" >> $GITHUB_PATH
    - name: Build docs
      working-directory: ./edgehog-device-esp32/doc
      run: doxygen edgehog-device-sdk-esp32.doxy
    - name: Copy Docs
      run: |
        esp32_device_dir="docs/devices/esp32"
        if [ ! -d "$esp32_device_dir" ]; then
            mkdir -p "$esp32_device_dir"
        fi
        export DOCS_DIRNAME="devices/esp32/$(echo ${{ github.ref }} | sed 's,refs/heads/,,' | sed 's/main/snapshot/g' | sed 's/release-//g')"
        rm -rf docs/$DOCS_DIRNAME
        mkdir -p docs/$DOCS_DIRNAME/api
        cp -r edgehog-device-esp32/doc/out/html/* docs/$DOCS_DIRNAME/api
    - name: Commit files
      working-directory: ./docs
      run: |
        git config --local user.email "edgehog-machine@secomind.com"
        git config --local user.name "Edgehog Bot"
        git add .
        git commit -m "Update Edgehog ESP32 device documentation"
    - name: Push changes
      working-directory: ./docs
      run: |
        git push
